services:
  web:
    build: .
    container_name: tgdd_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: my_store
      DB_USER: root
      DB_PASS: root
      APP_DEBUG: "1"
      APP_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  # MariaDB để giống môi trường InfinityFree (tránh lỗi collation khi import)
  db:
    image: mariadb:10.6
    container_name: tgdd_db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: my_store
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: tgdd_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    depends_on:
      - db

volumes:
  db_data:
